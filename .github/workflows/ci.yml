name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Create an isolated environment
        run: |
          python -m venv .venv
          python -c "import os,pathlib; d=pathlib.Path('.venv') / ('Scripts' if os.name=='nt' else 'bin'); f=open(os.environ['GITHUB_PATH'],'a',encoding='utf-8'); f.write(str(d.resolve())+'\n'); f.close()"
      - name: Install locked runtime
        run: python -m pip install -r requirements.txt
      - name: Check package compatibility
        run: python -m pip check
      - name: Protocol and analysis tests
        run: python -m unittest discover -s tests -v
      - name: Verify original published results
        run: python -m src.validation
      - name: Verify committed development study when present
        run: python -m src.robustness_validation --if-exists
      - name: Verify report numeric evidence against saved logs
        run: python -m src.report_facts --check
      - name: Exercise the complete development-only pipeline with a small budget
        run: python run_robustness.py --config configs/robustness-smoke.json --output "${{ runner.temp }}/digits-rf-smoke"
      - name: Check the model demo
        run: python demo.py --index 123
